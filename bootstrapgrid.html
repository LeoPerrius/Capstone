<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    
</head>
  <body>
 <h1 class="text-center" style="color:rgb(64, 116, 211);">How do you cook your eggs?</h1>

   <div class="container">
  <div class="row border p-3">
    <div class="col border border-primary m-1">
      1. Balut
        <img src="https://philtimes.com/wp-content/uploads/2019/04/Balut_wikimedia.jpg" alt="Image 1" width="130" height="118">
    </div>
    <div class="col border border-danger m-1">
      2. Scrambled
      <img src="https://kristineskitchenblog.com/wp-content/uploads/2021/11/best-scrambled-eggs-recipe-0815.jpg" alt="Image 2" class="img-fluid">
    </div>
    <div class="col border border-success m-1">
      3. Boiled
      <img src="https://dieteticdirections.com/wp-content/uploads/2015/11/eggs-hard.jpg" alt="Image 3" class="img-fluid">
    </div>
  </div>
</div>

 <div class="container text-center">
  <div class="row border p-3">
    <div class="col border border-warning m-1">
      4. Omelette
      <img src="https://joyfoodsunshine.com/wp-content/uploads/2022/07/best-omelette-recipe-1.jpg" alt="image 4" class="img-fluid">
    </div>
    <div class="col border border-accent m-1">
      5. Sunny Side
      <img src="https://www.eatingwell.com/thmb/8sy-NWRFvE-tWD17pvbBRmZ_RyA=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/EWL-8031221-pristine-sunny-side-up-eggs-3f42c173c31344c8984f32d74a83a613.jpg" alt="Image 5" class="img-fluid">
    </div>
    <div class="col border border-info m-1">
      6. Pickled
      <img src="https://tse4.mm.bing.net/th/id/OIP._ZTAvCOQASVT7PPkNYrdtwHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Image 6" class="img-fluid">
    </div>
  </div>
</div>

 <div class="container text-center">
  <div class="row border p-3">
    <div class="col border border-primary m-1" style="background-color: rgb(110, 196, 142);">
      7. Fried
      <img src="https://tse3.mm.bing.net/th/id/OIP.VA1imwgW1W1tkRqT2F45fQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Image 7" class="img-fluid">
    </div>
    <div class="col border border-danger m-1">
      8. Deviled
      <img src="https://tse2.mm.bing.net/th/id/OIP.e-vNR2_Ki6ERzchKf15dzwHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Image 8" class="img-fluid">
    </div>
    <div class="col border border-success m-1">
      9. Green Eggs with ham
      <img src="https://thebigsmoke.com.au/wp-content/uploads/green-eggs-and-ham-1024x767.jpg" alt="Image 9" class="img-fluid">
    </div>
  </div>
</div>

  </body>
</html>
